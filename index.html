<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cổng Nền tảng số pháp luật</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: trung tâm điều hành — dải hero tối (A tổng quan + vòng ưu tiên) → lưới bento: B Xử lý (radar hạn + danh sách) | A Sức khỏe hệ thống → A Xu hướng (phễu 7 bước, CSDLQG 12 tháng) → C Tiện ích */
:root{
  --bg:#F4F7FC; --panel:#FFFFFF; --tile:#F6F9FE; --tint:#EAF2FF;
  --ink:#0F1F35; --ink2:#3A4B63; --muted:#6A7A90; --line:#E3EAF4; --line2:#CCD7E6;
  --brand:#1A5FD0; --brand-deep:#0F3E8C; --brand-ink:#FFFFFF; --gold:#E39B1B; --gold2:#F6C350;
  --red:#D23A24; --redbg:#FDECE9; --amber:#B86A00; --amberbar:#F0961F; --ambg:#FFF3DE;
  --gray:#8C98AA; --graybg:#EEF2F7; --green:#12805A; --greenbg:#E2F6EC;
  --note:#FFF6D6; --note-ink:#6B4E00; --note-line:#E9CF7A;
  --hero1:#FFFFFF; --hero2:#E6F0FF; --h-glow1:rgba(59,130,246,.20); --h-glow2:rgba(20,184,166,.12); --h-dotc:rgba(26,95,208,.12);
  --h-ink:#0F1F35; --h-ink2:#4A5B73; --h-glass:rgba(255,255,255,.82); --h-line:rgba(26,95,208,.16);
  --shadow:0 1px 2px rgba(15,31,53,.04),0 8px 24px rgba(26,95,208,.07);
  --display:"Merriweather",Georgia,"Times New Roman",serif;
  --font:"Inter",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --panel:#111B2A; --tile:#162234; --tint:#182A42;
  --ink:#E7EDF5; --ink2:#C2CDDB; --muted:#8F9DB1; --line:#223249; --line2:#30455F;
  --brand:#86B6EE; --brand-ink:#0A111C; --gold:#E2B85E; --gold2:#F0D08E;
  --red:#FF8C7A; --redbg:#3A1B17; --amber:#F3B15A; --amberbar:#E08A1E; --ambg:#3A2913;
  --gray:#8C98AA; --graybg:#202D40; --green:#6FD5A2; --greenbg:#123128;
  --note:#33290E; --note-ink:#F3D98A; --note-line:#6E5A1E; --brand-deep:#CFE0FF;
  --hero1:#0B1730; --hero2:#0E2347; --h-glow1:rgba(59,130,246,.25); --h-glow2:rgba(20,184,166,.12); --h-dotc:rgba(255,255,255,.06);
  --h-ink:#F1F5FB; --h-ink2:rgba(241,245,251,.72); --h-glass:rgba(255,255,255,.06); --h-line:rgba(255,255,255,.14); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --panel:#111B2A; --tile:#162234; --tint:#182A42;
  --ink:#E7EDF5; --ink2:#C2CDDB; --muted:#8F9DB1; --line:#223249; --line2:#30455F;
  --brand:#86B6EE; --brand-ink:#0A111C; --gold:#E2B85E; --gold2:#F0D08E;
  --red:#FF8C7A; --redbg:#3A1B17; --amber:#F3B15A; --amberbar:#E08A1E; --ambg:#3A2913;
  --gray:#8C98AA; --graybg:#202D40; --green:#6FD5A2; --greenbg:#123128;
  --note:#33290E; --note-ink:#F3D98A; --note-line:#6E5A1E; --brand-deep:#CFE0FF;
  --hero1:#0B1730; --hero2:#0E2347; --h-glow1:rgba(59,130,246,.25); --h-glow2:rgba(20,184,166,.12); --h-dotc:rgba(255,255,255,.06);
  --h-ink:#F1F5FB; --h-ink2:rgba(241,245,251,.72); --h-glass:rgba(255,255,255,.06); --h-line:rgba(255,255,255,.14); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.005em}
svg text{font-family:var(--font)}

/* demo bar */
.demo{background:var(--note);border-bottom:1px solid var(--note-line);color:var(--note-ink);font-size:12.5px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:6px}
.demo b{font-weight:700;letter-spacing:.06em}
.demo .sp{margin-left:auto}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--note-line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--note-line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.tgl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--note-line);background:var(--panel);border-radius:9px;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.tgl[aria-pressed="true"]{border-color:var(--note-ink);color:var(--note-ink);font-weight:600}

/* hero shell */
.top{position:relative;color:var(--h-ink);background:
  radial-gradient(820px 380px at 88% -25%,var(--h-glow1),transparent 62%),
  radial-gradient(620px 360px at -5% 115%,var(--h-glow2),transparent 60%),
  linear-gradient(180deg,var(--hero1) 0%,var(--hero2) 100%);overflow:hidden;border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--h-dotc) 1.2px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);pointer-events:none}
.top>*{position:relative}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.bar img{height:54px;width:auto;background:linear-gradient(135deg,#0F3E8C,#1A5FD0);border-radius:12px;padding:5px 12px;box-shadow:0 4px 12px rgba(15,62,140,.25)}
.vr{width:1px;height:38px;background:var(--h-line)}
.pt .t1{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.02em;color:var(--brand-deep)}
.pt .t2{font-size:12px;color:var(--h-ink2)}
.bsearch{flex:1;min-width:220px;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--h-glass);border:1px solid var(--h-line);border-radius:12px;padding:7px 8px 7px 12px;box-shadow:var(--shadow);color:var(--muted)}
.bsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px}
.bsearch input::placeholder{color:var(--muted)}
.bsearch kbd{font-family:var(--font);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4C8DF6,#1A5FD0);color:#fff;display:grid;place-items:center;font-weight:700}
.who .n{font-weight:600;font-size:13.5px}.who .r{font-size:11.5px;color:var(--h-ink2)}
.ghost{background:var(--h-glass);border:1px solid var(--h-line);color:var(--h-ink);border-radius:10px;padding:7px 12px;font-size:12.5px}
.gold-btn{background:linear-gradient(135deg,#3B82F6,#1A5FD0);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-weight:600;box-shadow:0 6px 16px rgba(26,95,208,.28)}

/* hero content (after login) */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr);gap:28px;align-items:center;padding-block:14px 30px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700}
.hero h1{font-size:32px;line-height:1.2;margin-top:6px;color:var(--h-ink)}
.hero .lead{color:var(--h-ink2);margin-top:10px;font-size:15px;max-width:46ch}
.hero .lead b{color:var(--h-ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hp{border:1px solid var(--h-line);background:var(--h-glass);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--h-ink2);display:inline-flex;gap:6px;align-items:center}
.ringbox{display:flex;align-items:center;gap:20px;justify-content:center}
.ring text{fill:var(--h-ink)}
.rlg{display:flex;flex-direction:column;gap:10px}
.rlg button{display:grid;grid-template-columns:10px auto;column-gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--h-ink);padding:0}
.rlg .v{font-size:24px;font-weight:700;line-height:1}
.rlg .k{grid-column:2;font-size:12px;color:var(--h-ink2)}
.sw{width:10px;height:10px;border-radius:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--h-glass);border:1px solid var(--h-line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.kpi .k{font-size:11.5px;color:var(--h-ink2)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi svg{display:block;margin-top:6px}
.ztag-d{display:inline-flex;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--brand);border:1px solid var(--h-line);background:var(--h-glass);border-radius:6px;padding:2px 7px;margin-bottom:8px}
/* bento */
.page{display:flex;flex-direction:column;gap:22px;padding-block:22px 40px}
.bento{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 0}
.ph h2{font-size:17px}
.ph .hint{font-size:12.5px;color:var(--muted)}
.ph .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ztag{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--brand);background:var(--tint);border-radius:6px;padding:3px 8px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:12px 18px 0}
.tab{border:1px solid var(--line);background:var(--tile);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.cnt{font-size:11.5px;border-radius:999px;padding:1px 7px;font-weight:700}
.c-qh{background:var(--redbg);color:var(--red)}.c-sdh{background:var(--ambg);color:var(--amber)}.c-loi{background:var(--graybg);color:var(--ink2)}
.src{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.link{color:var(--brand);font-weight:600;background:none;border:0;padding:0;font-size:13px}
.ic{width:36px;height:36px;border-radius:11px;background:var(--tint);color:var(--brand);display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.note{display:none;background:var(--note);border:1px dashed var(--note-line);color:var(--note-ink);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5}
.ann .note{display:block}
.top .note{margin-bottom:16px}

/* radar */
.radar{padding:6px 10px 0}
.radar svg{width:100%;height:auto;display:block;overflow:visible}
.rd{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.rd:hover,.rd:focus{transform:scale(1.35)}
.rlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:2px 18px 0}
.rlegend span{display:inline-flex;gap:6px;align-items:center}

/* task list */
.tasks{padding:6px 18px 6px}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover .tt{color:var(--brand)}
.dd{border-radius:12px;text-align:center;padding:6px 0;font-family:var(--display)}
.dd .v{font-size:20px;font-weight:600;line-height:1}
.dd .k{font-size:10px;font-family:var(--font);margin-top:2px}
.dd.qh{background:var(--redbg);color:var(--red)}.dd.sdh{background:var(--ambg);color:var(--amber)}.dd.loi{background:var(--graybg);color:var(--ink2)}
.tt{font-weight:600;font-size:14px;line-height:1.35}
.tm{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;align-items:center}
.stag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--tint);color:var(--brand)}
.mini{display:inline-flex;gap:3px;align-items:center}
.mini i{width:14px;height:4px;border-radius:2px;background:var(--line2)}
.mini i.d{background:var(--brand)}.mini i.c{background:var(--red)}
.xl{border:1px solid var(--line2);color:var(--ink);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.xl:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.empty{display:flex;gap:8px;align-items:center;color:var(--green);font-size:13px;padding:18px 0}
.pf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 18px 16px}
.goes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px 18px 18px}
.go{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:10px 12px;transition:border-color .15s,transform .15s}
.go:hover{border-color:var(--brand);transform:translateY(-1px)}
.go .a{font-size:13px;font-weight:600;line-height:1.3}
.go .b{font-size:11.5px;color:var(--muted)}
.go .ar{margin-left:auto;color:var(--brand)}

/* system health */
.sys{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sys+.sys{border-top:1px solid var(--line)}
.sh{display:flex;gap:10px;align-items:center}
.sh .nm{font-weight:600;font-size:13.5px;line-height:1.3;flex:1;min-width:0}
.stp{font-size:11px;display:inline-flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}
.mb{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;font-size:12px;cursor:pointer;border:0;background:transparent;text-align:left;padding:0;width:100%}
.mb .l{color:var(--ink2);grid-column:1/3;display:flex;justify-content:space-between}
.mb .l b{font-family:var(--display);font-weight:600;color:var(--ink)}
.mb.w .l b{color:var(--red)}
.mb .tr{grid-column:1/3;height:6px;border-radius:3px;background:var(--tile);overflow:hidden}
.mb .tr span{display:block;height:100%;border-radius:3px;background:var(--brand)}
.mb.w .tr span{background:var(--red)}
.mb:hover .l{color:var(--brand)}
.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hidden-sys{font-size:12px;color:var(--muted);padding:12px 16px;border-top:1px dashed var(--line)}

/* trends */
.trend{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.trend.one{grid-template-columns:minmax(0,1fr)}
.cv{padding:8px 14px 14px}
.cv svg{width:100%;height:auto;display:block;overflow:visible}
.hz rect.h{fill:transparent}
.hz line{opacity:0;transition:opacity .1s}
.hz:hover line{opacity:1}
.hz:hover circle{r:5}
.stg{cursor:pointer}
.stg:hover rect.b{fill:var(--gold)}

/* utilities */
.util{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:20px}
.util.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:15px}
.ms{display:flex;gap:6px;border:1px solid var(--line2);border-radius:12px;padding:5px 5px 5px 12px;background:var(--tile)}
.ms input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:transparent;color:var(--ink)}
.ms button{border:0;border-radius:9px;background:var(--ink);color:var(--panel);padding:6px 14px;font-size:12.5px;font-weight:600}
.ltabs{display:flex;gap:4px;flex-wrap:wrap}
.ltabs button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.ltabs button[aria-selected="true"]{background:var(--tint);color:var(--brand);font-weight:600}
.law{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.law:last-child{border-bottom:0}
.law .dt{text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;font-family:var(--display);line-height:1.1}
.law .dt b{display:block;font-size:16px;font-weight:600}.law .dt span{font-size:10px;color:var(--muted)}
.law .t{font-size:13.5px;font-weight:500;line-height:1.35}
.law .m2{font-size:12px;color:var(--muted)}
.hl{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.list{display:flex;flex-direction:column}
.list button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;font-size:13px;line-height:1.35}
.list button:last-child{border-bottom:0}
.list .d{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.matrix th,.matrix td{border-bottom:1px solid var(--note-line);padding:6px 8px;text-align:left;vertical-align:top}
.yes{color:var(--green);font-weight:700}.no{color:var(--muted)}

/* guest */
.ghero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:30px 44px}
.ghero h1{font-size:40px;line-height:1.18;margin-top:10px;color:var(--h-ink)}
.ghero h1 em{font-style:normal;color:var(--brand)}
.ghero p{color:var(--h-ink2);margin:12px 0 20px;font-size:15px;max-width:52ch}
.gs{display:flex;gap:8px;background:#fff;border:1px solid var(--h-line);border-radius:16px;padding:8px 8px 8px 18px;box-shadow:0 14px 40px rgba(26,95,208,.16)}
.gs input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;color:#0F1F35;background:transparent}
.gs input::placeholder{color:#7A8799}
.qf{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qf button{border:1px solid var(--h-line);background:var(--h-glass);color:var(--h-ink2);border-radius:999px;padding:5px 12px;font-size:12.5px}
.qf button:hover{border-color:var(--brand);color:var(--brand)}
.glass{background:var(--h-glass);border:1px solid var(--h-line);border-radius:22px;padding:22px;backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(26,95,208,.12);display:flex;flex-direction:column;gap:14px}
.glass h2{font-size:20px}
.glass p{margin:0;color:var(--h-ink2);font-size:13px}
.syslogos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.syslogos div{height:40px;border-radius:11px;background:var(--tint);border:1px solid var(--h-line);display:grid;place-items:center;color:var(--brand)}
.syslogos svg{width:18px;height:18px}
.gstat{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.gstat div .v{font-size:24px;font-weight:700;color:var(--h-ink)}
.gstat div .k{font-size:12px;color:var(--h-ink2)}

/* heat matrix */
.heat{padding:12px 12px 2px;overflow-x:auto}
.heat table{width:100%;border-collapse:separate;border-spacing:6px;min-width:580px}
.heat th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 2px;line-height:1.3;vertical-align:bottom}
.heat th i{display:block;height:3px;border-radius:2px;margin-top:6px}
.heat th.l{text-align:left}
.heat td.n{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;padding-right:4px}
.heat .c{width:100%;height:46px;border:0;border-radius:11px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;transition:transform .12s}
.heat .c.z{background:var(--tile);color:var(--line2);font-weight:400;cursor:default}
.heat .c:not(.z):hover{transform:translateY(-1px);box-shadow:0 0 0 2px var(--ink)}
.heat td.t{font-weight:700;text-align:center;font-size:15px;color:var(--ink)}
.heat tfoot td{font-size:12px;color:var(--muted);text-align:center;font-weight:600}.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:16px;text-align:left;transition:border-color .15s}
.tile:hover{border-color:var(--brand)}
.tile .a{font-weight:600;font-size:13.5px;line-height:1.3}
.tile .b{font-size:12px;color:var(--muted);margin-top:2px}
.lock{margin-left:auto;color:var(--muted);flex:none}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.foot .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:6px 18px}

/* drawer, tooltip, toast */
.ov{position:fixed;inset:0;background:rgba(6,20,43,.5);z-index:40;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)}
.dr{width:min(520px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h h3{font-size:17px;line-height:1.35}
.dr-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.dr-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;line-height:1;margin-left:auto;color:var(--muted)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:13px;padding-bottom:10px;position:relative}
.step i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);margin-top:2px;z-index:1}
.step::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done i{background:var(--brand);border-color:var(--brand)}
.step.cur i{border-color:var(--red);background:var(--redbg)}
.step.cur b{color:var(--red)}
.step.todo{color:var(--muted)}
.btn-p{background:var(--ink);color:var(--panel);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn-s{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px 16px;font-weight:500}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1180px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero .kpis{grid-column:1/-1}.bento,.trend,.g2{grid-template-columns:minmax(0,1fr)}.util,.util.two{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.hero,.ghero{grid-template-columns:minmax(0,1fr)}.hero h1,.ghero h1{font-size:28px}.vr,.pt .t2,.who .r,.bsearch kbd{display:none}.bsearch{order:5;max-width:none;flex-basis:100%}.tiles{grid-template-columns:minmax(0,1fr)}.ringbox{justify-content:flex-start}}
@media (max-width:520px){.trow{grid-template-columns:48px minmax(0,1fr)}.trow .xl{grid-column:2;justify-self:start}.kv{grid-template-columns:minmax(0,1fr)}.bar img{height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function ring(vals){
  const r=58, C=2*Math.PI*r, tot=vals.reduce((a,b)=>a+b,0)||1; let off=0;
  const segs = vals.map((v,i)=>{ if(!v) return ''; const L=Math.max(0,v/tot*C-(vals.filter(x=>x).length>1?4:0));
    const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${PK[i][3]}" stroke-width="16" stroke-dasharray="${L} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)" data-tip="${PK[i][1]}: ${v} việc"/>`; off+=v/tot*C; return s; }).join('');
  return `<svg class="ring" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Vòng việc ưu tiên"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line)" stroke-width="16"/>${segs}
    <text x="75" y="76" text-anchor="middle" style="font-family:var(--display);font-size:34px;font-weight:900">${vals.reduce((a,b)=>a+b,0)}</text>
    <text x="75" y="98" text-anchor="middle" style="font-size:11px;fill:var(--h-ink2)">việc ưu tiên</text></svg>`;
}
function spark(){
  const W=150,H=34,mx=Math.max(...MONTHS.map(m=>m[1])),mn=Math.min(...MONTHS.map(m=>m[1]));
  const pts=MONTHS.map((m,i)=>[i/(MONTHS.length-1)*W, H-3-(m[1]-mn)/(mx-mn)*(H-8)]);

  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${W} ${H} L0 ${H}Z" fill="rgba(26,95,208,.12)"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="var(--brand)"/></svg>`;
}
function radar(ids){
  const W=720, L=130, R=W-70, lh=40, top=34, H=top+ids.length*lh+30;
  const x=d=>L+(Math.max(-15,Math.min(15,d))+15)/30*(R-L);

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar hạn xử lý theo hệ thống">`;
  s+=`<rect x="${L}" y="${top-8}" width="${x(0)-L}" height="${ids.length*lh+8}" rx="8" fill="var(--redbg)" opacity=".7"/>`;
  s+=`<text x="${L+8}" y="${top-14}" style="font-size:11px;fill:var(--red);font-weight:600">◀ QUÁ HẠN</text><text x="${R-8}" y="${top-14}" text-anchor="end" style="font-size:11px;fill:var(--amber);font-weight:600">SẮP ĐẾN HẠN ▶</text><text x="${nd}" y="${top-14}" text-anchor="middle" style="font-size:10.5px;fill:var(--muted)">Không hạn</text>`;
  ids.forEach((id,i)=>{const y=top+i*lh+lh/2-4; s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-12}" y="${y+4}" text-anchor="end" style="font-size:12.5px;fill:var(--ink2);font-weight:500">${SYS[id].s}</text>`;});
  [-14,-7,7,14].forEach(d=>{s+=`<line x1="${x(d)}" x2="${x(d)}" y1="${top-6}" y2="${top+ids.length*lh}" stroke="var(--line)"/><text x="${x(d)}" y="${H-8}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${d>0?'+':'−'}${Math.abs(d)} ngày</text>`;});
  s+=`<line x1="${x(0)}" x2="${x(0)}" y1="${top-10}" y2="${top+ids.length*lh+2}" stroke="var(--gold)" stroke-width="2"/><text x="${x(0)}" y="${H-8}" text-anchor="middle" style="font-size:11px;fill:var(--gold);font-weight:700">Hôm nay 03/11</text>`;
  TASKS.filter(t=>ids.includes(t.sys)).forEach(t=>{const i=ids.indexOf(t.sys), y=top+i*lh+lh/2-4, c=PK.find(p=>p[0]===t.p)[3];

    if(t.d===null) s+=`<path class="rd" d="M${nd} ${y-9} L${nd+9} ${y} L${nd} ${y+9} L${nd-9} ${y}Z" fill="${c}" stroke="var(--panel)" stroke-width="2" data-a="task" data-v="${t.id}" data-tip="${tip}" tabindex="0"/>`;

  return s+'</svg>';
}

      </div>

    <section class="panel"><div class="ph"><h2>Văn bản cập nhật vào CSDLQG</h2><span class="hint">12 tháng gần nhất</span></div><div class="cv">${area(1100,250)}</div><div class="pf"><span class="src">Nguồn: CSDLQG (YC46, YC50) · số liệu minh họa</span></div></section>
    <section class="col" style="gap:12px"><h2 style="font-size:17px">Các hệ thống thành phần</h2>
      <div class="tiles">${ORDER.map(id=>`<button class="tile" data-a="login"><div class="ic">${IC[SYS[id].ic]}</div><div><div class="a">${SYS[id].n}</div><div class="b">Đăng nhập để sử dụng</div></div><span class="lock">${IC.lock}</span></button>`).join('')}</div>
    </section>
  </main>`;
}

/* ---------- workspace ---------- */
function hero(R){
  const ids=R.sys, v=PK.map((p,i)=>sum(ids,i)), tot=v.reduce((a,b)=>a+b,0);
  const hasCs=ids.includes('cs'), hasCt=ids.includes('ct');
  const k1 = hasCt?`<div class="kpi"><div class="k">VB quy định chi tiết nợ ban hành</div><div class="v num" style="color:var(--red)">5</div><div class="s">PM Quản lý chương trình</div></div>`
           : `<div class="kpi"><div class="k">Công việc chưa xử lý</div><div class="v num" style="color:var(--red)">10</div><div class="s">PM Theo dõi thi hành</div></div>`;
  const k2 = hasCs?`<div class="kpi"><div class="k">VB cập nhật CSDLQG tháng 10</div><div class="v num">${fmt(MONTHS[11][1])}</div>${spark()}</div>`
           : ids.includes('kt')?`<div class="kpi"><div class="k">VB chờ kiểm tra</div><div class="v num">5</div><div class="s">PM Kiểm tra</div></div>`
           : `<div class="kpi"><div class="k">Công việc đã xử lý</div><div class="v num">10</div><div class="s">PM Theo dõi thi hành</div></div>`;
  return `<div class="wrap hero">
    <div style="min-width:0">
      <div class="eyebrow">Thứ Ba, 03 tháng 11, 2026</div>
      <h1>Chào ${R.name.split(' ').pop()},</h1>
      <p class="lead">Hôm nay có <b>${tot} việc ưu tiên</b> trên ${ids.length} hệ thống của bạn. <b>${v[0]} việc đã quá hạn</b> cần xử lý trước.</p>
      <div class="pills"><span class="hp">Nhóm <b>&nbsp;${R.label}</b></span><span class="hp">${R.range}</span><span class="hp"><span class="dot" style="background:var(--green)"></span>Đồng bộ 08:30</span></div>
    </div>
    <div style="min-width:0"><span class="ztag-d">A · THÔNG TIN</span><div class="ringbox">${ring(v)}
      <div class="rlg">${PK.map((p,i)=>`<button data-a="pk" data-v="${p[0]}"><span class="sw" style="background:${p[3]}"></span><span class="v num">${v[i]}</span><span class="k">${p[1]}</span></button>`).join('')}</div></div></div>
    <div class="kpis">${k1}${k2}</div>
  </div>
  <div class="wrap">${note('<b>Khối Thông tin (BB mục 2.2)</b> gói gọn trong dải đầu trang. Vòng tròn cộng việc ưu tiên của các hệ thống được cấp quyền. Bấm chú giải để lọc danh sách bên dưới.')}</div>`;
}
function zoneB(R){
  const ids=R.sys, f=(S.f!=='all'&&ids.includes(S.f))?[S.f]:ids;
  const rows=TASKS.filter(t=>f.includes(t.sys)&&t.p===S.pk);
  return `<section class="panel">
    <div class="ph"><span class="ztag">B · XỬ LÝ NGHIỆP VỤ</span><h2>Ma trận hạn xử lý</h2><span class="hint">Số việc theo hệ thống và mức độ gấp · bấm một ô để lọc danh sách</span></div>
    ${heat(ids)}
    ${ids.length>1?`<div class="tabs" style="padding-top:14px">${['all',...ids].map(id=>`<button class="chip" data-a="f" data-v="${id}" aria-pressed="${id==='all'?(S.f==='all'||!ids.includes(S.f)):S.f===id}">${id==='all'?'Tất cả hệ thống':SYS[id].s}</button>`).join('')}</div>`:''}
    <div class="tabs" role="tablist">${PK.map((p,i)=>`<button class="tab" role="tab" data-a="pk" data-v="${p[0]}" aria-selected="${S.pk===p[0]}">${p[1]} <span class="cnt ${p[2]} num">${sum(f,i)}</span></button>`).join('')}</div>
    <div class="tasks">${rows.length?rows.map(t=>`<div class="trow" data-a="task" data-v="${t.id}" role="button" tabindex="0">
        <div class="dd ${t.p}">${t.d===null?'<div class="v">!</div><div class="k">lỗi</div>':`<div class="v num">${t.d<0?'−'+(-t.d):'+'+t.d}</div><div class="k">ngày</div>`}</div>
        <div style="min-width:0"><div class="tt">${t.t}</div><div class="tm"><span class="stag">${SYS[t.sys].s}</span><span>${t.k}</span><span>${t.cq}</span>${t.han?`<span class="num">Hạn ${t.han}</span>`:''}
          ${t.step!==undefined?`<span class="mini" data-tip="Bước ${t.step+1}/7: ${STEPS[t.step]}">${STEPS.map((s,i)=>`<i class="${i<t.step?'d':i===t.step?'c':''}"></i>`).join('')}</span>`:''}</div></div>
        <button class="xl" data-a="go" data-v="${t.id}">Xử lý ↗</button></div>`).join('')
      :`<div class="empty">${IC.ok} Không có việc ${PK.find(p=>p[0]===S.pk)[1].toLowerCase()} trong phạm vi đang xem.</div>`}</div>
    <div class="pf"><span class="src">${rows.length} việc minh họa · tổng ${PK.reduce((a,p,i)=>a+sum(f,i),0)} việc ưu tiên</span><button class="link" data-a="toast" data-v="Mở Lớp 2: danh sách đầy đủ có bộ lọc (demo)">Xem toàn bộ danh sách →</button></div>
    <div class="ph" style="padding-top:4px;border-top:1px solid var(--line);margin-top:4px;padding-block:14px 0"><h2 style="font-size:15px">Lối vào nghiệp vụ</h2><span class="hint">Mở thẳng danh sách trên phần mềm gốc qua SSO</span></div>
    <div class="goes">${ids.flatMap(id=>SYS[id].go.map(g=>`<button class="go" data-a="toast" data-v="Mở ${g[0]} trên ${SYS[id].n} qua SSO (demo)"><div class="ic">${IC[SYS[id].ic]}</div><div style="min-width:0"><div class="a">${g[0]}</div><div class="b">${SYS[id].s} · ${g[1]}</div></div><span class="ar">${IC.arrow}</span></button>`)).join('')}</div>
    <div style="padding:0 18px 16px">${note('<b>Khối chính (BB mục 2.2).</b> Ma trận chia việc ưu tiên theo số ngày so với hôm nay, ô càng đậm càng nhiều việc. Bấm một ô để lọc danh sách bên dưới. Quá hạn / Sắp đến hạn / Lỗi lấy theo bản đã trình lãnh đạo. <b>Cần xác nhận nguồn hạn xử lý</b> (Phụ lục 1 không có). "Xử lý ↗" cần mẫu đường dẫn của từng PM.')}</div>
  </section>`;
}
function zoneA(R){
  const ids=R.sys, hid=ORDER.length-ids.length;
  return `<section class="panel">
    <div class="ph" style="padding-bottom:6px"><span class="ztag">A · THÔNG TIN</span><h2>Sức khỏe hệ thống</h2></div>
    ${ids.map(id=>{const sy=SYS[id], mx=Math.max(...sy.g.flatMap(g=>g[1].map(m=>m[0])));
      return `<div class="sys"><div class="sh"><div class="ic">${IC[sy.ic]}</div><div class="nm">${sy.n}</div><span class="stp" data-tip="Trạng thái kết nối (QT YC43)"><span class="dot" style="background:${dotc(sy.st[0])}"></span>${sy.st[1]} · ${sy.st[2]}</span></div>
        ${sy.g.map(g=>`<div class="grp">${g[0]}</div>${g[1].map(m=>`<button class="mb ${m[2]?'w':''}" data-a="toast" data-v="Mở Lớp 2: ${m[1]} – ${sy.s} (demo)"><span class="l"><span>${m[1]}</span><b class="num">${m[0]}</b></span><span class="tr"><span style="width:${m[0]/mx*100}%"></span></span></button>`).join('')}`).join('')}
      </div>`}).join('')}
    ${R.admin?`<div class="sys"><div class="sh"><div class="ic">${IC.gear}</div><div class="nm">Hệ thống quản trị nền tảng số PLVN</div><button class="link" data-a="toast" data-v="Mở Hệ thống quản trị (demo)">Mở ↗</button></div></div>`:''}
    ${hid?`<div class="hidden-sys">${hid} hệ thống khác không thuộc quyền của bạn nên không hiển thị.</div>`:''}
    <div style="padding:0 16px 16px">${note('<b>BB mục 2.1.</b> Chỉ hiện hệ thống được cấp quyền. Thanh ngang so độ lớn các chỉ số trong cùng một hệ thống. Chỉ số theo bản đã trình lãnh đạo. Trạng thái kết nối lấy từ QT YC43.')}</div>
  </section>`;
}
function trends(R){
  const ct=R.sys.includes('ct'), cs=R.sys.includes('cs'); if(!ct&&!cs) return '';
  return `<div class="trend ${ct&&cs?'':'one'}">
    ${ct?`<section class="panel"><div class="ph"><span class="ztag">A · THÔNG TIN</span><h2>Tiến trình xây dựng VBQPPL</h2><span class="hint">Số nhiệm vụ đang ở từng bước</span></div><div class="cv">${funnel()}</div><div class="pf"><span class="src">Nguồn: PM Quản lý chương trình, Phụ lục 1 mục VII.8–VII.14 · số liệu minh họa</span></div></section>`:''}
    ${cs?`<section class="panel"><div class="ph"><span class="ztag">A · THÔNG TIN</span><h2>Văn bản cập nhật vào CSDLQG</h2><span class="hint">12 tháng</span></div><div class="cv">${area()}</div><div class="pf"><span class="src">Nguồn: CSDLQG (YC46, YC50) · số liệu minh họa</span></div></section>`:''}
  </div>`;
}
function zoneC(R){
  const lite=R.sys.length===1;
  return `<section class="col" style="gap:12px"><div style="display:flex;gap:10px;align-items:center"><span class="ztag">C · TIỆN ÍCH DÙNG CHUNG</span><h2 style="font-size:17px">Tra cứu và hỗ trợ</h2></div>
    <div class="util ${lite?'two':''}">
      <div class="panel card"><h3>Tra cứu văn bản QPPL</h3><form class="ms" data-f="s"><input id="q-law" placeholder="Số hiệu, tên văn bản, từ khóa…" aria-label="Tra cứu văn bản QPPL"><button>Tra cứu</button></form>${lawList(3)}</div>
      <div class="panel card"><h3>Hướng dẫn sử dụng</h3><div class="list">${GUIDES.map(n=>`<button data-a="toast" data-v="Mở tài liệu (demo)"><span>${n[0]}<span class="d">${n[1]}</span></span></button>`).join('')}</div></div>
      ${lite?'':`<div class="panel card"><h3>Tin tức và thông báo</h3><div class="list">${NEWS.map(n=>`<button data-a="toast" data-v="Mở tin (demo)"><span>${n[0]}<span class="d num">${n[1]}</span></span></button>`).join('')}</div></div>`}
    </div>${note('<b>BB mục 2.2.</b> Tiện ích được gán theo nhóm người dùng. Nhóm chuyên biệt dùng bản rút gọn.')}</section>`;
}
function matrix(){
  const v=x=>x==='yes'?'<span class="yes">✓</span>':x==='no'?'<span class="no">–</span>':x;
  return `<section class="note"><b>Ma trận gán khối và tiện ích theo nhóm người dùng</b> (cho tài liệu thuyết minh, BB mục 3)
    <div class="matrix" style="margin-top:8px"><table><thead><tr><th>Khối / tiện ích</th><th>Khách</th><th>Full quyền</th><th>Chuyên môn cao</th><th>Chuyên biệt</th><th>Lý do</th></tr></thead>
    <tbody>${MATRIX.map(r=>`<tr><td>${r[0]}</td><td>${v(r[1])}</td><td>${v(r[2])}</td><td>${v(r[3])}</td><td>${v(r[4])}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div>
    <div style="margin-top:6px">Số tài khoản từng nhóm: <b>chờ kết quả thống kê</b>.</div></section>`;
}
function workspace(){
  const R=ROLES[S.role];
  return `<section class="top">${topbar()}${hero(R)}</section>
  <main class="wrap page">
    <div class="bento">${zoneB(R)}${zoneA(R)}</div>
    ${trends(R)}
    ${zoneC(R)}
    ${matrix()}
  </main>`;
}
function drawer(){
  const t=TASKS.find(x=>x.id===S.task); if(!t) return '';
  const sy=SYS[t.sys];
  const flow=t.sys==='ct'
    ?`<div class="lbl">Tiến trình xây dựng VBQPPL</div><div class="steps">${STEPS.map((s,i)=>`<div class="step ${i<t.step?'done':i===t.step?'cur':'todo'}"><i></i><div>${i===t.step?`<b>${s}</b> · đang ở bước này`:s}</div></div>`).join('')}</div><span class="src">Nguồn: PM Quản lý chương trình (Phụ lục 1 mục VII.8–VII.14)</span>`
    :`<div class="lbl">Trạng thái hiện tại</div><div><span class="cnt ${PK.find(p=>p[0]===t.p)[2]}">${t.k}</span></div>`;
  return `<div class="ov" data-a="close"><aside class="dr" role="dialog" aria-modal="true" aria-label="Chi tiết việc">
    <div class="dr-h"><div class="ic">${IC[sy.ic]}</div><div style="min-width:0"><div class="src">${sy.n}</div><h3>${t.t}</h3></div><button class="x" data-a="close" aria-label="Đóng">×</button></div>
    <div class="dr-b"><dl class="kv"><dt>Loại việc</dt><dd>${t.k}</dd><dt>Cơ quan</dt><dd>${t.cq}</dd>${t.han?`<dt>Hạn xử lý</dt><dd class="num">${t.han} · ${t.d<0?`<span style="color:var(--red);font-weight:600">quá hạn ${-t.d} ngày</span>`:`<span style="color:var(--amber);font-weight:600">còn ${t.d} ngày</span>`}</dd>`:''}</dl>
      ${flow}
      <div class="lbl">Kịch bản xử lý</div>
      <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px"><li>Bấm <b>Xử lý trên phần mềm gốc</b>. Cổng mở đúng hồ sơ này qua SSO.</li><li>Thao tác nghiệp vụ trên ${sy.n}.</li><li>Quay lại cổng. Việc tự rời danh sách ở lần đồng bộ kế tiếp.</li></ol>
      ${note('Dữ liệu minh họa. Tên cơ quan và văn bản đã ẩn danh.')}</div>
    <div class="dr-f"><button class="btn-s" data-a="close">Đóng</button><button class="btn-p" data-a="go" data-v="${t.id}">Xử lý trên phần mềm gốc ↗</button></div></aside></div>`;
}
function render(){
  const app=document.getElementById('app');
  app.className=S.ann?'ann':'';
  app.innerHTML=demoBar()+(S.role==='guest'?guest():workspace())
    +`<footer class="foot"><div class="wrap"><span>Nền tảng số pháp luật Việt Nam · Bộ Tư pháp</span><span>Bản thiết kế demo, không phải cổng chính thức</span></div></footer>`
    +drawer()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
  tip.hidden=true;
}
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el){tip.hidden=true;return;} tip.textContent=el.getAttribute('data-tip'); tip.hidden=false;});
document.addEventListener('mousemove',e=>{ if(tip.hidden) return; const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8) x=e.clientX-w-14; tip.style.left=x+'px'; tip.style.top=(e.clientY+16)+'px'; });
let tt;
function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render();},2400);}
function setRole(r){S.role=r;S.f='all';S.task=null;try{localStorage.setItem('ntspl-role-18',r)}catch(e){} render(); window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset?el.dataset.a:el.getAttribute('data-a'), v=el.getAttribute('data-v');
  if(a==='close'){ if(e.target===el||el.tagName==='BUTTON'){S.task=null;render();} return; }
  if(el.closest('.dr')&&a!=='go') return;
  if(a==='role') setRole(v); else if(a==='login') setRole('full'); else if(a==='logout') setRole('guest');
  else if(a==='ann'){S.ann=!S.ann;render();}
  else if(a==='pk'){S.pk=v;render(); if(el.closest('.rlg')) document.querySelector('.tasks').scrollIntoView({behavior:'smooth',block:'center'});}
  else if(a==='f'){S.f=v;render();}
  else if(a==='cell'){const q=v.split('|');S.f=q[0];S.pk=q[1];render();const tk=document.querySelector('.tasks');if(tk)tk.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='lt'){S.lt=v;render();}
  else if(a==='task'){S.task=+v;render();}
  else if(a==='go'){const t=TASKS.find(x=>x.id===+v);S.task=null;toast(`Demo: mở hồ sơ trên ${SYS[t.sys].n} qua SSO`);}
  else if(a==='toast') toast(v);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.task){S.task=null;render();}
  const t=e.target; if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('data-a')==='task'){e.preventDefault();S.task=+t.getAttribute('data-v');render();}
});
document.addEventListener('submit',e=>{e.preventDefault();toast('Demo: chuyển sang trang kết quả tìm kiếm');});
render();
</script>
